{{- $rawName := default .Chart.Name .Values.nameOverride -}}
{{- $chartName := $rawName | trunc 63 | trimSuffix "-" -}}
{{- $releaseBase := ternary .Release.Name (printf "%s-%s" .Release.Name $rawName) (contains $rawName .Release.Name) -}}
{{- $fullName := default $releaseBase .Values.fullnameOverride | trunc 63 | trimSuffix "-" -}}
{{- $backendName := printf "%s-backend" $fullName | trunc 63 | trimSuffix "-" -}}
{{- $postgresName := printf "%s-postgres" $fullName | trunc 63 | trimSuffix "-" -}}
{{- $chartLabel := printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $backendName }}-config
  labels:
    helm.sh/chart: {{ $chartLabel }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ $chartName }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
data:
  POSTGRES_DB: {{ .Values.backend.config.POSTGRES_DB | quote }}
  POSTGRES_USER: {{ .Values.backend.config.POSTGRES_USER | quote }}
  POSTGRES_HOST: {{ default $postgresName .Values.backend.config.POSTGRES_HOST | quote }}
  PORT: {{ .Values.backend.config.PORT | quote }}
  APP_PORT: {{ .Values.backend.config.APP_PORT | quote }}
  APP_HOST: {{ .Values.backend.config.APP_HOST | quote }}
