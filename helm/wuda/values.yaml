global:
  imagePullSecrets: []

frontend:
  replicaCount: 1
  image:
    repository: front-end
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  config:
    BACKEND_HOSTNAME: ""
    BACKEND_PORT: "5000"
    APP_PORT: "8000"
    APP_HOST: "0.0.0.0"
  secrets:
    SECRET_KEY: secretkey
    existingSecret: ""
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}
  livenessProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: frontend.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

backend:
  replicaCount: 1
  image:
    repository: back-end
    tag: latest
    pullPolicy: IfNotPresent
  containerPort: 5000
  service:
    type: ClusterIP
    port: 5000
  config:
    POSTGRES_DB: wuda
    POSTGRES_USER: wuda
    POSTGRES_HOST: ""
    PORT: "5432"
    APP_PORT: "5000"
    APP_HOST: "0.0.0.0"
  secrets:
    POSTGRES_PASSWORD: postgrespassword
    JWT_KEY: jwtkey
    existingSecret: ""
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}
  livenessProbe:
    enabled: true
    path: /liveness
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    enabled: true
    path: /readiness
    initialDelaySeconds: 10
    periodSeconds: 10
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: backend.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  containerPort: 5432
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: false
    size: 1Gi
    storageClassName: ""
  config:
    POSTGRES_DB: wuda
    POSTGRES_USER: wuda
  secrets:
    POSTGRES_PASSWORD: postgrespassword
    existingSecret: ""
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}
  livenessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
  readinessProbe:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
